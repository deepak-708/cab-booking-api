spring.application.name=cab booking api

# ==============================================================
# 1. SERVER CONFIGURATION
# ==============================================================
server.port=${PORT:8080}

server.error.include-message=always

# ==============================================================
# 2. DATABASE CONNECTION (POSTGRES)
# CHANGE 'your_password' below!
# 'createDatabaseIfNotExist=true' will create the DB automatically for you.
# ==============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# 3. JPA / HIBERNATE (ORM)
# ==============================================================
# 'update': Creates tables if missing, updates them if columns added
spring.jpa.hibernate.ddl-auto=update

# Dialect for Postgress (Handles JSON/Spatial types better if needed later)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Show SQL queries in the console (Great for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# 4. DATA INITIALIZATION (data.sql)
# ==============================================================
# Forces data.sql to run AFTER Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==============================================================
# 5. ACTUATOR CONFIGURATION
# ==============================================================
# Expose endpoints to check App Health, Metrics, and Mappings
# Access at: http://localhost:8080/actuator
management.endpoints.web.exposure.include=health,info,metrics,mappings,beans

# Show detailed health info (e.g., is DB down? is Disk full?)
management.endpoint.health.show-details=always

# ==============================================================
# 6. JSON FORMATTING
# ==============================================================
spring.jackson.serialization.indent_output=true

# ==============================================================
# 7. SWAGGER UI / OPENAPI
# ==============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================================================
# 8. LOGGING
# ==============================================================
logging.level.com.cabapp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO